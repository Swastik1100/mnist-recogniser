<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MNIST Recogniser</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>MNIST Recogniser</h1>
    <p>Draw a single digit (0-9), then predict.</p>

    <canvas id="canvas" width="280" height="280" aria-label="Drawing canvas"></canvas>

    <div class="actions">
      <button id="clearBtn" type="button">Clear</button>
      <button id="predictBtn" type="button">Predict</button>
    </div>

    <p class="result">Prediction: <span id="prediction">-</span></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
